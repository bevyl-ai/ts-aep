name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache upstream py-aep and its samples
        uses: actions/cache@v4
        with:
          path: .upstream
          key: upstream-${{ hashFiles('UPSTREAM_COMMIT', 'tools/lfs_fetch.py') }}

      - run: bun install --frozen-lockfile

      - name: Fetch upstream samples
        run: tools/fetch-samples.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Upstream test suite
        run: bun test --timeout 60000

      - name: Byte-identical round trip of every sample
        run: |
          bun tools/corpus_roundtrip.ts | tee roundtrip.json
          python3 -c "import json,sys; r=json.loads(open('roundtrip.json').readline()); sys.exit(0 if r['identical']==r['total'] else 1)"

      - name: Packed tarball works in Node and Bun
        run: tools/pack_smoke.sh

  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: astral-sh/setup-uv@v6

      - name: Cache upstream py-aep and its samples
        uses: actions/cache@v4
        with:
          path: .upstream
          key: upstream-${{ hashFiles('UPSTREAM_COMMIT', 'tools/lfs_fetch.py') }}

      - run: bun install --frozen-lockfile

      - name: Fetch upstream samples
        run: tools/fetch-samples.sh

      - name: Differential check against py-aep
        run: |
          (cd .upstream && uv sync -q)
          tools/diff/run.sh 4
          tools/diff/edit_run.sh 40 4
          python3 tools/diff/gate.py
